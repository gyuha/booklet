<!doctype html>
<!--
  Playwright 렌더 검증용 픽스처. Tauri 없이 브라우저에서 src/reader.ts 를 그대로 구동한다.
  vite build 의 기본 input 은 index.html 하나뿐이라 이 파일은 배포 산출물에 들어가지 않는다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>booklet render check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #reader {
        position: fixed;
        inset: 0;
      }
      foliate-view {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* 파일 입력이 본문 클릭 검증을 방해하지 않도록 화면 밖으로 뺀다 */
      #file {
        position: fixed;
        top: -100px;
      }
      /* 목차 패널 대역 — 자체 스크롤을 가진 앱 크롬. 휠이 여기서는
         페이지를 넘기지 말고 이 요소를 스크롤해야 한다. 기본은 숨김. */
      #chrome {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 30;
        width: 220px;
        overflow-y: auto;
        background: #eee;
      }
      #chrome[hidden] {
        display: none;
      }
      #chrome-tall {
        height: 3000px;
      }
    </style>
  </head>
  <body>
    <input type="file" id="file" />
    <div id="reader"></div>
    <!-- 진행률 인디게이터 대역. 앱(index.html)과 **같은 id·같은 갱신 함수**를 쓴다 —
         스타일은 앱의 styles.css 에만 있으므로 여기서는 로직만 검증된다(배치는 사람 UAT). -->
    <div id="progress" hidden>
      <span id="progress-pct"></span>
      <div id="progress-track"><div id="progress-fill"></div></div>
    </div>

    <div id="chrome" hidden>
      <!-- 설정 패널의 슬라이더 대역. 여기 포커스가 있을 때 방향키·스페이스가
           페이지를 넘기지 않아야 한다(폼 컨트롤 가드). -->
      <input id="chrome-range" type="range" min="0" max="100" step="1" value="50" />
      <div id="chrome-tall"></div>
    </div>
    <script type="module">
      import {
        createReader,
        flattenToc,
        DEFAULT_TYPOGRAPHY,
        BUNDLED_FONT_FAMILY,
        BUNDLED_FONT_SRC,
      } from "/src/reader.ts";
      import { availableFonts, isFontAvailable } from "/src/fonts.ts";
      import { renderProgress } from "/src/progress.ts";

      const reader = createReader(document.querySelector("#reader"));
      const locations = [];
      const progressEl = document.querySelector("#progress");
      const progressFill = document.querySelector("#progress-fill");
      const progressPct = document.querySelector("#progress-pct");

      // main.ts 와 동일한 순서: 진행률을 먼저 갱신한 뒤 위치를 기록한다.
      reader.onRelocate((loc) => {
        renderProgress(progressFill, progressPct, loc.fraction);
        locations.push(loc);
      });

      const typo = { ...DEFAULT_TYPOGRAPHY };

      window.check = {
        reader,
        locations,
        opened: false,
        // 두 번째 책 열기를 검증하려면 "몇 번째 오픈이 끝났는지" 가 필요하다
        openCount: 0,
        toc: () => flattenToc(reader.toc()).filter((i) => i.href),
        // 타이포그래피는 일부만 바꿔 적용할 수 있게 한다 (체크 작성 편의)
        setTypography: (patch) => {
          Object.assign(typo, patch);
          reader.setTypography(typo);
        },
        availableFonts,
        isFontAvailable,
        bundledFont: bundledFontState,
      };

      /**
       * 번들한 기본 본문 글꼴이 실제로 로드되는지를 **두 층**에서 본다.
       * C8(WKWebView)에서는 본문 iframe 관측이 막힐 수 있어, 관측 한계와 실제
       * 실패를 구분할 수 있게 층을 나눴다.
       *
       *  - `mainStatus`: 최상위 프레임에서 폰트 파일을 직접 로드해 본다. 어느 하네스에서든
       *    관측 가능한 바닥이며, 패키징 누락·경로 오류를 잡는다.
       *  - `sections`: 섹션 문서의 `FontFaceSet` 상태와 body 의 계산된 글꼴. 관측이 막히면
       *    예외 대신 `unreachable: …` 문자열을 돌려 "실패" 와 구별한다.
       */
      async function bundledFontState() {
        let mainStatus;
        try {
          const ff = new FontFace(
            "__bundled_probe__",
            `url("${BUNDLED_FONT_SRC}")`,
          );
          await ff.load();
          mainStatus = ff.status;
        } catch (e) {
          mainStatus = `error: ${e?.message ?? e}`;
        }

        let sections;
        try {
          const contents =
            document.querySelector("foliate-view")?.renderer?.getContents?.() ??
            [];
          sections = contents.map(({ doc }) => ({
            face:
              [...doc.fonts].find((f) => f.family === BUNDLED_FONT_FAMILY)
                ?.status ?? null,
            bodyFamily: doc.defaultView.getComputedStyle(doc.body).fontFamily,
          }));
        } catch (e) {
          sections = `unreachable: ${e?.message ?? e}`;
        }

        return {
          family: BUNDLED_FONT_FAMILY,
          src: BUNDLED_FONT_SRC,
          mainStatus,
          sections,
        };
      }

      const opened = async (blob, lastLocation) => {
        await reader.open(blob, lastLocation);
        window.check.opened = true;
        window.check.openCount += 1;
        progressEl.hidden = false; // main.ts 와 동일 — 책이 열린 뒤에만 보인다
      };

      document.querySelector("#file").addEventListener("change", (e) =>
        opened(e.target.files[0]),
      );

      // WKWebView 하네스(C8)용 진입점. <input type=file> 을 네이티브에서 조작할 수
      // 없으므로 URL 로 받아 fetch 한다. /fixtures/*.epub 은 vite 미들웨어가 서빙한다.
      window.check.openUrl = async (url, lastLocation) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
        // foliate 의 makeBook 은 file.name 으로 포맷을 판별한다. Blob 에는 name 이
        // 없으므로 File 로 감싸야 한다 (main.ts 가 하는 것과 동일).
        const name = url.split("/").pop();
        await opened(
          new File([await res.blob()], name, {
            type: "application/epub+zip",
          }),
          lastLocation,
        );
      };
    </script>
  </body>
</html>
